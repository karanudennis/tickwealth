<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TickWealth – Playbook</title>
<meta name="description" content="Strategy playbook: entry rules for every market, live rule checks with a countdown, and tests against random chance.">
<link rel="stylesheet" href="core.css">
<style>
.pb{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:14px}
.pb-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.pb-c{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;background:rgba(255,255,255,.04)}
.pb-c h3{margin:0 0 2px;font-size:16px}.pb-t{font-size:11px;color:#00b2ff;letter-spacing:.4px}
.pb-r{margin:8px 0;padding:8px;border-radius:8px;background:rgba(0,0,0,.3);font-size:13px}
.pb-l{font-size:12.5px;margin:4px 0;color:#c9d3e8}.pb-w{font-size:12px;color:#8e9ab3;margin-top:6px}
.pb-s{margin:8px 0;padding:8px;border-radius:8px;border:1px dashed rgba(255,255,255,.2);font-size:13px}
.pb-s.on{border:1px solid #00ffa3;color:#00ffa3}
.pb-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.pb-row input[type=number]{width:80px}
.pb-v.good{color:#00ffa3}.pb-v.bad{color:#ff3b69}
</style>
</head>
<body>
<div id="top"></div>
<div id="app"><div class="pb" id="pb"></div></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="ai.js"></script>
<script>
/* Playbook: strategy cards. Each card = an ENTRY RULE you define + the true odds + a test on recent real ticks vs random entries.
   A rule firing is NOT a forecast. Ticks on synthetic indices are independent. */
const CTYPE={RISE:'CALL',FALL:'PUT',OVER:'DIGITOVER',UNDER:'DIGITUNDER',EVEN:'DIGITEVEN',ODD:'DIGITODD',MATCH:'DIGITMATCH',DIFF:'DIGITDIFF'};
const NAME={RISE:'Rise',FALL:'Fall',OVER:'Over',UNDER:'Under',EVEN:'Even',ODD:'Odd',MATCH:'Matches',DIFF:'Differs'};
const pc=(c,b)=>({RISE:.5,FALL:.5,EVEN:.5,ODD:.5,MATCH:.1,DIFF:.9,OVER:(9-b)/10,UNDER:b/10})[c];
const payEst=p=>0.96/p-1; // estimate only: real payouts come from Deriv's live price
const hasB=c=>['OVER','UNDER','MATCH','DIFF'].includes(c);
const winV=(c,b,p0,p1,d)=>c==='RISE'?p1>p0:c==='FALL'?p1<p0:c==='OVER'?d>b:c==='UNDER'?d<b:c==='EVEN'?d%2===0:c==='ODD'?d%2===1:c==='MATCH'?d===b:d!==b;
const run=(f,i,n)=>{for(let k=0;k<n;k++){if(i-k<1||!f(i-k))return false;}return true};
const share=(D,i,d)=>D.slice(i-99,i+1).filter(x=>x===d).length;
const mean=(P,i)=>{let s=0;for(let k=i-99;k<=i;k++)s+=Math.abs(P[k]-P[k-1]);return s/100};
let SYM='R_100';
const ST=[
 {id:'u7',name:'Under 7 Patience',fam:'DIGITS · UNDER',mk:'d',dur:1,rule:'Enter Under 7 after 2 digits of 8 or 9 in a row.',why:'Under 7 wins when the exit digit is 0 to 6 (70% true chance). The streak is only a disciplined entry, not a signal. Payout is small, so one loss wipes out about 2.7 wins.',trig:(P,D,i)=>run(k=>D[k]>=8,i,2)?{c:'UNDER',b:7}:null},
 {id:'o2',name:'Over 2 Patience',fam:'DIGITS · OVER',mk:'d',dur:1,rule:'Enter Over 2 after 2 digits of 0 or 1 in a row.',why:'Over 2 wins on digits 3 to 9 (70% true chance). Same math as Under 7: a high win rate with a small payout.',trig:(P,D,i)=>run(k=>D[k]<=1,i,2)?{c:'OVER',b:2}:null},
 {id:'of',name:'Even Streak Fade',fam:'DIGITS · PARITY',mk:'d',dur:1,rule:'Enter Odd after 4 even digits in a row.',why:'Tests the "it is due" belief. Digits have no memory, so the true chance stays 50% after any streak.',trig:(P,D,i)=>run(k=>D[k]%2===0,i,4)?{c:'ODD'}:null},
 {id:'ef',name:'Odd Streak Fade',fam:'DIGITS · PARITY',mk:'d',dur:1,rule:'Enter Even after 4 odd digits in a row.',why:'The mirror of Even Streak Fade. Compare the two: results should look alike, which is the point.',trig:(P,D,i)=>run(k=>D[k]%2===1,i,4)?{c:'EVEN'}:null},
 {id:'hm',name:'Hot Digit Match',fam:'DIGITS · MATCHES',mk:'d',dur:1,rule:'Enter Matches on the most frequent digit when it makes up 14% or more of the last 100 ticks.',why:'Matches wins 10% of the time with a large payout. A digit that is hot now is not more likely next: the true chance stays 10%.',trig:(P,D,i)=>{if(i<100)return null;const c=Array(10).fill(0);D.slice(i-99,i+1).forEach(x=>c[x]++);const h=c.indexOf(Math.max(...c));return c[h]>=14?{c:'MATCH',b:h}:null}},
 {id:'cd',name:'Cold Digit Differs',fam:'DIGITS · DIFFERS',mk:'d',dur:1,rule:'Enter Differs on the rarest digit when it makes up 6% or less of the last 100 ticks.',why:'Differs wins 90% of the time but pays very little, so one loss erases about 10 wins.',trig:(P,D,i)=>{if(i<100)return null;const c=Array(10).fill(0);D.slice(i-99,i+1).forEach(x=>c[x]++);const l=c.indexOf(Math.min(...c));return c[l]<=6?{c:'DIFF',b:l}:null}},
 {id:'rm',name:'Rise Momentum',fam:'RISE/FALL',mk:'a',dur:5,rule:'Enter Rise for 5 ticks after 3 higher ticks in a row.',why:'Tests momentum. On random walks the next move is 50/50 whatever came before.',trig:(P,D,i)=>run(k=>P[k]>P[k-1],i,3)?{c:'RISE'}:null},
 {id:'fm',name:'Fall Momentum',fam:'RISE/FALL',mk:'a',dur:5,rule:'Enter Fall for 5 ticks after 3 lower ticks in a row.',why:'The mirror of Rise Momentum.',trig:(P,D,i)=>run(k=>P[k]<P[k-1],i,3)?{c:'FALL'}:null},
 {id:'rr',name:'Rise Reversal',fam:'RISE/FALL',mk:'a',dur:5,rule:'Enter Rise for 5 ticks after 4 lower ticks in a row.',why:'Tests mean reversion, the opposite belief to momentum. If both beliefs "work" in a backtest, it is luck.',trig:(P,D,i)=>run(k=>P[k]<P[k-1],i,4)?{c:'RISE'}:null},
 {id:'bc',name:'Spike Drift Watch',fam:'BOOM / CRASH',mk:'b',dur:5,rule:'Two ticks after a spike (a move over 4 times the average), enter Fall on Boom or Rise on Crash.',why:'Boom drifts down between upward spikes and Crash drifts up between downward spikes, but the spikes cost what the drift earns. Test it before trusting it.',trig:(P,D,i)=>{if(i<104)return null;const m=mean(P,i-2);return Math.abs(P[i-2]-P[i-3])>4*m?{c:SYM.startsWith('BOOM')?'FALL':'RISE'}:null}}
];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const pb=document.getElementById('pb'), top=TW.mountTop({active:'playbook',symbols:'all',defaultSymbol:'R_100',onSymbol:s=>setSym(s)});
const intro=el('div','pb-c');intro.appendChild(el('h3',0,'Playbook: entry rules for every market'));
intro.appendChild(el('div','pb-l','Pick a market at the top. Each card is a rule you can arm: it shows the true win chance, the payout break-even, a test on the last 1000 ticks against random entries, and a 10-second countdown when the rule fires. A rule firing is not a forecast. Ticks are random, so no entry timing changes the true chance.'));pb.appendChild(intro);
function info(sym){let m;
 if(m=sym.match(/^R_(\d+)$/))return{n:'Volatility '+m[1]+' Index',t:2,fit:'d',w:'Constant '+m[1]+'% volatility. A new tick about every 2 seconds. A larger number means bigger tick moves, so Rise/Fall results swing more, while digit odds stay exactly the same.'};
 if(m=sym.match(/^1HZ(\d+)V$/))return{n:'Volatility '+m[1]+' (1s) Index',t:1,fit:'d',w:'Constant '+m[1]+'% volatility with a tick every second. Contracts finish twice as fast as on the 2-second indices, so a run of losses also arrives faster. Keep stakes small.'};
 if(m=sym.match(/^BOOM(\d+)$/))return{n:'Boom '+m[1]+' Index',t:1,fit:'b',w:'Slow downward drift with an upward spike about once every '+m[1]+' ticks on average. Spike timing is random, so a long wait does not make one due. A spike can wipe out a Fall position at once.'};
 if(m=sym.match(/^CRASH(\d+)$/))return{n:'Crash '+m[1]+' Index',t:1,fit:'b',w:'Slow upward drift with a downward spike about once every '+m[1]+' ticks on average. The mirror of Boom: a spike can wipe out a Rise position at once.'};
 if(sym==='RDBULL')return{n:'Bull Market Index',t:2,fit:'r',w:'Designed with an upward tendency and random variation. A tendency in the design does not decide the next contract. Check Deriv\'s description for its exact behaviour.'};
 if(sym==='RDBEAR')return{n:'Bear Market Index',t:2,fit:'r',w:'Designed with a downward tendency and random variation. A tendency in the design does not decide the next contract. Check Deriv\'s description for its exact behaviour.'};
 return{n:sym,t:2,fit:'r',w:'No special notes. Treat every tick as independent.'}}
function setNote(sym){const x=info(sym);note.textContent='';note.appendChild(el('div','pb-t','NOTES FOR THIS MARKET'));note.appendChild(el('h3',0,x.n));
 const fit=x.fit==='d'?'All 10 cards fit: the digit cards (1-tick contracts) and the Rise/Fall cards (5-tick contracts).':x.fit==='b'?'Spike Drift Watch and the Rise/Fall cards fit. Digit contracts are not offered on this market.':'The Rise/Fall cards fit. Digit contracts are not offered on this market.';
 [['What it is: '+x.w],['1000 ticks covers about '+(x.t*1000/60).toFixed(0)+' minutes of this market.'],['Cards that fit: '+fit],['Reminder: these notes describe how the market is built. They do not predict the next tick, and the true odds of every contract stay the same.']].forEach(l=>note.appendChild(el('div','pb-l',l[0])))}
const grid=el('div','pb-grid');pb.appendChild(grid);
const U={};let F=null;
ST.forEach(s=>{
 const c=el('div','pb-c');c.appendChild(el('div','pb-t',s.fam));c.appendChild(el('h3',0,s.name));
 c.appendChild(el('div','pb-r','Entry: '+s.rule));c.appendChild(el('div','pb-l','Duration: '+s.dur+' tick(s)'));
 const odds=el('div','pb-l');const bt=el('div','pb-l','Test: waiting for ticks...');const rnd=el('div','pb-l');const vd=el('div','pb-l pb-v');
 const live=el('div','pb-s','Status: not armed');
 const row=el('div','pb-row');const arm=el('input');arm.type='checkbox';arm.id='a-'+s.id;const lb=el('label',0,'Arm rule');lb.htmlFor=arm.id;
 const stake=el('input');stake.type='number';stake.min='0.35';stake.step='0.01';stake.value='0.35';stake.setAttribute('aria-label','Stake');
 const go=el('button','btn','Trade now');go.disabled=true;row.append(arm,lb,stake,go);
 c.append(odds,bt,rnd,vd,live,row,el('div','pb-w','Why: '+s.why));grid.appendChild(c);
 U[s.id]={s,c,odds,bt,rnd,vd,live,arm,stake,go,cd:0,t:null,cur:null};
 arm.onchange=()=>{live.textContent=arm.checked?'Status: armed, waiting for your rule':'Status: not armed';live.className='pb-s'};
 go.onclick=()=>{const u=U[s.id];if(!u.cur)return;TW.trade({contract_type:CTYPE[u.cur.c],symbol:SYM,amount:+stake.value,duration:s.dur,duration_unit:'t',barrier:hasB(u.cur.c)?String(u.cur.b):undefined,label:s.name,bot:'Playbook'}).then(()=>TW.toast('Trade placed: '+s.name+' ('+TW.mode()+')','ok',3000)).catch(e=>TW.toast(e.message||String(e),'err',5000))};
});
function compat(s){return s.mk==='a'||(s.mk==='d'&&TW.VOLS.some(v=>v.id===SYM&&v.digits))||(s.mk==='b'&&/^(BOOM|CRASH)/.test(SYM))}
function test(s,u){
 const P=F.prices,D=F.digits,n=P.length;if(n<300){u.bt.textContent='Test: need 300+ ticks, loaded '+n;return}
 const tr=[];let last=-9;for(let i=100;i<n-s.dur-1;i++){if(i-last<5)continue;const t=s.trig(P,D,i);if(t){tr.push({i,t});last=i}}
 const K=tr.length;if(!K){u.bt.textContent='Test: the rule never fired in the last '+n+' ticks.';u.rnd.textContent='';u.vd.textContent='';return}
 let W=0,net=0,be=0;tr.forEach(({i,t})=>{const p=pc(t.c,t.b),w=winV(t.c,t.b,P[i],P[i+s.dur],D[i+s.dur]);be+=1/(1+payEst(p));if(w){W++;net+=payEst(p)}else net-=1});be/=K;
 const base=[];for(let r=0;r<200;r++){let x=0;for(let q=0;q<K;q++){const t=tr[Math.floor(Math.random()*K)].t,j=100+Math.floor(Math.random()*(n-s.dur-101));x+=winV(t.c,t.b,P[j],P[j+s.dur],D[j+s.dur])?payEst(pc(t.c,t.b)):-1}base.push(x)}base.sort((a,b)=>a-b);
 u.bt.textContent=`Test (last ${n} ticks): fired ${K}x, won ${(W/K*100).toFixed(0)}% (break-even ${(be*100).toFixed(0)}%), net ${net.toFixed(2)} units.`;
 u.rnd.textContent=`Random entries: median ${base[100].toFixed(2)}, range ${base[10].toFixed(2)} to ${base[190].toFixed(2)}.`;
 u.vd.textContent=K<30?'Verdict: too few trades to judge.':net>base[190]?'Verdict: above 95% of random runs on this sample. It may still be luck or overfitting.':'Verdict: within the range of random chance.';
 u.vd.className='pb-l pb-v '+(K>=30&&net>base[190]?'good':'bad');
}
function odds(s,u){const t=s.trig(F.prices,F.digits,F.prices.length-1)||{c:s.id==='bc'?(SYM.startsWith('BOOM')?'FALL':'RISE'):({u7:'UNDER',o2:'OVER',of:'ODD',ef:'EVEN',hm:'MATCH',cd:'DIFF',rm:'RISE',fm:'FALL',rr:'RISE'})[s.id],b:({u7:7,o2:2})[s.id]};const p=pc(t.c,t.b);
 u.odds.textContent=`True chance of a win: ${(p*100).toFixed(0)}%. Estimated payout ${(payEst(p)*100).toFixed(0)}%, so break-even needs ${(100/(1+payEst(p))).toFixed(0)}%. Expected result: ${((p*payEst(p)-(1-p))).toFixed(3)} per 1 staked.`}
function fire(u,t){u.cur=t;u.cd=10;u.go.disabled=false;u.live.className='pb-s on';clearInterval(u.t);
 const tick=()=>{if(u.cd>0){u.live.textContent=`RULE MET: ${NAME[t.c]}${hasB(t.c)?' '+t.b:''} for ${u.s.dur} tick(s). Valid for ${u.cd}s. True chance ${(pc(t.c,t.b)*100).toFixed(0)}%.`;u.cd--}else{clearInterval(u.t);u.live.textContent='Prompt expired. Waiting for the rule again.';u.live.className='pb-s';u.go.disabled=true;u.cur=null}};tick();u.t=setInterval(tick,1000)}
function refresh(){ST.forEach(s=>{const u=U[s.id],ok=compat(s);u.c.style.display=ok?'':'none';if(ok&&F&&F.prices.length>110){odds(s,u);test(s,u)}})}
function live(f){const i=f.prices.length-1;ST.forEach(s=>{const u=U[s.id];if(!u.arm.checked||!compat(s)||u.cd>0||i<110)return;const t=s.trig(f.prices,f.digits,i);if(t)fire(u,t)})}
function setSym(sym){SYM=sym;setNote(sym);if(F)F.close();ST.forEach(s=>{const u=U[s.id];clearInterval(u.t);u.cd=0;u.cur=null;u.go.disabled=true;u.live.textContent=u.arm.checked?'Status: armed, waiting for your rule':'Status: not armed';u.live.className='pb-s'});
 F=TW.tickFeed(sym,{primary:false,count:1000,onHistory:refresh,onTick:f=>{live(f)}})}
setSym(top.symbol||'R_100');
</script>
<script src="advisor.js"></script>
</body>
</html>
